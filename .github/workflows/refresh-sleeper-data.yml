name: Refresh Sleeper data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  refresh-player-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Sleeper snapshot
        run: python3 scripts/refresh_players.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SleeperAPI.json
          if git diff --cached --quiet; then
            echo "No Sleeper data changes to commit."
            exit 0
          fi
          git commit -m "Refresh Sleeper player snapshot"
          git push
